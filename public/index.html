<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#b9e2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HTF 숙제 타임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
    <span class="twinkle t1">✦</span><span class="twinkle t2">✧</span><span class="twinkle t3">✦</span>
    <span class="twinkle t4">✧</span><span class="twinkle t5">✦</span>
  </div>

  <header id="topbar" hidden></header>

  <main id="app">
    <section class="screen center boot">
      <div class="boot-clock">⏱️</div>
      <p>HTF 를 깨우는 중이에요…</p>
      <small>처음엔 1분 정도 걸릴 수 있어요 😴</small>
    </section>
  </main>

  <div id="banners" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript>이 앱은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
